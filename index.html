<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無線受信記録ソフト</title>
    <!-- JSZipライブラリ（一括ZIPダウンロード用） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary-color: #ffffff;
            --bg-color: #000000;
            --card-bg: #000000;
            --text-color: #ffffff;
            --border-color: #333333;
            --danger-color: #ff4d4d;
            --success-color: #ffffff;
            --line-color: #06c755;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            line-height: 1.4;
            width: 100vw;
            height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }
        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            flex-shrink: 0;
        }
        h1 {
            color: #ffffff;
            margin: 0;
            font-size: 1.3rem;
        }
        .card-header-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 10px;
        }
        h2 {
            color: #ffffff;
            font-size: 1rem;
            margin: 0;
            border: none;
            padding: 0;
        }
        .card {
            background: var(--card-bg);
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 0 0 1px var(--border-color);
            flex-shrink: 0;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }
        /* 画面横幅を3分割：音量レベル(1fr)、空白(1fr)、音量バー(1fr)の構成 */
        .receive-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 0;
            align-items: center;
        }
        .setting-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 3px;
            color: #ffffff;
        }
        select, input[type="range"], button {
            padding: 8px;
            font-size: 0.9rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
        select { background-color: #000000; color: #ffffff; }
        .range-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
        }
        .range-container input { flex: 1; background: #000000; }
        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        button {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s, color 0.2s;
            font-weight: bold;
        }
        button:hover { background-color: #000000; color: #ffffff; }
        button.secondary { background-color: #000000; color: #ffffff; border: 1px solid #ffffff; }
        button.secondary:hover { background-color: #ffffff; color: #000000; }
        
        /* モニタ音声切替ボタン：「切」は黒背景、「入」は白背景 */
        button.monitor-btn {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
        }
        button.monitor-btn.active {
            background-color: #ffffff;
            color: #000000;
        }

        button.btn-line { background-color: #000000; color: #06c755; border: 1px solid #06c755; }
        button.btn-line:hover { background-color: #06c755; color: #000000; }
        button:disabled { background-color: #000000; color: #444444; border-color: #222222; cursor: not-allowed; }
        
        .status {
            font-weight: bold;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background-color: #111111;
            color: #ffffff;
            border: 1px solid var(--border-color);
            font-size: 0.8rem;
            text-align: center;
            min-width: 50px;
        }
        .status.active { background-color: #000000; color: #ffffff; border-color: #ffffff; }
        .status.recording { background-color: #000000; color: #ff4d4d; border-color: #ff4d4d; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .meter-box {
            background: #111111;
            border-radius: 4px;
            height: 14px;
            width: 100%;
            overflow: hidden;
            margin-top: 3px;
            position: relative;
            border: 1px solid var(--border-color);
        }
        .meter-fill {
            background: linear-gradient(to right, #3b82f6, #22c55e, #eab308, #f97316, #ef4444);
            height: 100%;
            width: 0%;
            transition: width 0.05s linear;
        }
        .meter-threshold {
            position: absolute;
            top: 0; bottom: 0;
            width: 2px;
            background: #ffffff;
        }
        .live-transcription-box {
            background: #000000;
            color: #ffffff;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 1rem;
            min-height: 35px;
            max-height: 70px;
            overflow-y: auto;
            margin-top: 5px;
            word-break: break-all;
            border: 1px solid var(--border-color);
        }
        .log-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        .log-list-container {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #000000;
            min-height: 120px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            word-wrap: break-word;
            overflow-wrap: break-word;
            font-size: 0.9rem;
        }
        th {
            background-color: #000000;
            color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
            cursor: pointer;
            user-select: none;
            border-bottom: 2px solid #ffffff;
        }
        th:hover { background-color: #111111; }
        th .sort-icon { font-size: 0.75rem; color: #ffffff; margin-left: 4px; }
        
        .col-select { width: 40px; text-align: center; }
        .col-time { width: 140px; white-space: nowrap; }
        .col-duration { width: 80px; white-space: nowrap; }
        .col-text { width: auto; }
        .col-action { width: 190px; text-align: right; white-space: nowrap; }

        .clickable-text {
            cursor: pointer;
            color: #ffffff;
            text-decoration: underline dotted;
        }
        .clickable-text:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .batch-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .batch-left {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .action-btns { 
            display: flex; 
            gap: 4px; 
            justify-content: flex-end; 
            flex-wrap: nowrap;
        }
        .btn-sm { padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; }
        .btn-danger { background-color: #000000; color: #ff4d4d; border: 1px solid #ff4d4d; }
        .btn-danger:hover { background-color: #ff4d4d; color: #000000; }
        
        .player-panel-inline {
            display: none;
            align-items: center;
            gap: 8px;
            background: #000000;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            flex: 1;
            min-width: 250px;
        }
        .player-info {
            font-size: 0.75rem;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            color: #ffffff;
        }
        .player-controls input[type="range"] {
            flex: 1;
            cursor: pointer;
            background: #000000;
            height: 4px;
            padding: 0;
        }
        .collapsible-content {
            display: none;
        }
        .collapsible-content.open {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>無線受信記録ソフト</h1>
        <button id="toggleSettingsBtn" class="secondary btn-sm">⚙️ 設定を表示</button>
    </header>

    <!-- 設定パネル（折りたたみ式） -->
    <div class="card collapsible-content" id="settingsCard">
        <h2>デバイス設定 & 制御</h2>
        <div class="settings-grid">
            <div class="setting-group">
                <label for="audioSource">入力デバイス</label>
                <select id="audioSource">
                    <option value="">デバイスを読み込む</option>
                </select>
            </div>
            
            <div class="setting-group">
                <label for="audioOutput">出力先スピーカー</label>
                <select id="audioOutput">
                    <option value="">既定のスピーカー</option>
                </select>
            </div>

            <div style="grid-column: 1 / -1; margin: 3px 0; border-top: 1px dashed var(--border-color);"></div>

            <div class="setting-group">
                <label for="thresholdRange">音声検知感度 (閾値): <span id="thresholdValue">0.010</span></label>
                <div class="range-container">
                    <span>高</span>
                    <input type="range" id="thresholdRange" min="0.001" max="0.3" step="0.001" value="0.010">
                    <span>低</span>
                </div>
            </div>

            <div class="setting-group">
                <label>データ管理</label>
                <button id="clearAllDataBtn" class="btn-danger btn-sm" style="margin-top: 3px;">保存データをすべて削除</button>
            </div>
        </div>

        <div class="controls">
            <button id="initBtn">マイク接続許可</button>
            <button id="startBtn" disabled>自動録音開始</button>
            <button id="stopBtn" class="secondary" disabled>一時停止</button>
        </div>
    </div>

    <!-- 受信画面エリア -->
    <div class="card">
        <div class="card-header-flex">
            <h2>受信</h2>
        </div>
        
        <!-- 画面横幅を3等分（音量レベル、空白、音量バー）にし、ステータスを音量レベルの左側に配置 -->
        <div class="receive-grid">
            <!-- 1列目：ステータス ＆ 入力音量レベル -->
            <div class="setting-group">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px;">
                    <label style="margin-bottom: 0;">入力音量レベル</label>
                    <span id="statusBadge" class="status">待機</span>
                </div>
                <div class="meter-box" style="width: 100%;">
                    <div id="meterFill" class="meter-fill"></div>
                    <div id="meterThreshold" class="meter-threshold" style="left: 0%;"></div>
                </div>
            </div>

            <!-- 2列目：空白スペース -->
            <div></div>

            <!-- 3列目：モニタ音量 -->
            <div class="setting-group">
                <label for="monitorVolumeRange">モニタ音量: <span id="monitorVolumeValue">100%</span></label>
                <div class="range-container">
                    <span>0%</span>
                    <input type="range" id="monitorVolumeRange" min="0" max="1" step="0.05" value="1">
                    <span>100%</span>
                    <!-- モニタ音切替ボタン：「切」は黒背景、「入」は白背景 -->
                    <button id="monitorMuteBtn" class="monitor-btn btn-sm" style="min-width: 40px;">入</button>
                </div>
            </div>
        </div>

        <div style="margin-top: 8px;">
            <label>文字起こしプレビュー:</label>
            <div id="liveTranscription" class="live-transcription-box"></div>
        </div>
    </div>

    <!-- 受信ログ一覧 -->
    <div class="card log-section">
        <h2>受信ログ一覧</h2>
        
        <div class="batch-actions" style="margin-top: 8px;">
            <div class="batch-left">
                <button id="batchPlayBtn" class="btn-sm secondary" disabled>連続プレビュー</button>
                <button id="batchDownloadBtn" class="btn-sm secondary" disabled>ZIPダウンロード</button>
            </div>
            <!-- 音声再生プレビュー -->
            <div id="playerCard" class="player-panel-inline">
                <div id="playerInfoText" class="player-info">選択ファイルなし</div>
                <div class="player-controls">
                    <button id="playPauseBtn" class="btn-sm">一時停止</button>
                    <button id="stopPlayBtn" class="btn-sm secondary">停止</button>
                    <span id="currentTimeDisplay" style="font-family: monospace; font-size: 0.75rem;">0:00</span>
                    <input type="range" id="seekSlider" value="0" min="0" max="100" step="0.1">
                    <span id="durationDisplay" style="font-family: monospace; font-size: 0.75rem;">0:00</span>
                </div>
            </div>
        </div>
        <audio id="audioPlayer" style="display:none;"></audio>

        <div class="log-list-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-select"><input type="checkbox" id="selectAllCheckbox" title="すべて選択"></th>
                        <th class="col-time" data-sort="time">検知日時 <span class="sort-icon">↕</span></th>
                        <th class="col-duration" data-sort="duration">録音時間 <span class="sort-icon">↕</span></th>
                        <th class="col-text" data-sort="text">文字起こし内容 <span class="sort-icon">↕</span></th>
                        <th class="col-action">操作</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                    <tr id="emptyRow">
                        <td colspan="5" style="text-align: center; color: #888888; padding: 15px;">
                            ログなし
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let mediaStream = null;
    let audioContext = null;
    let sourceNode = null;
    let processorNode = null;
    let monitorGainNode = null;
    let recognition = null;
    let isRunning = false;
    let sampleRate = 44100;

    let preBuffer = []; 
    let activeRecordingChunks = []; 
    let isRecordingAudio = false;
    let silenceTimer = null;
    let currentTranscriptBuffer = "";
    let interimTranscriptBuffer = "";
    let isMonitorMuted = false;
    let recordingStartTime = 0;
    let previousMonitorState = false;

    let logDatabase = [];
    let currentSortColumn = null;
    let currentSortAscending = true;

    const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
    const settingsCard = document.getElementById('settingsCard');
    const initBtn = document.getElementById('initBtn');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const audioSourceSelect = document.getElementById('audioSource');
    const audioOutputSelect = document.getElementById('audioOutput');
    const statusBadge = document.getElementById('statusBadge');
    const liveTranscription = document.getElementById('liveTranscription');
    const logTableBody = document.getElementById('logTableBody');
    const emptyRow = document.getElementById('emptyRow');
    const selectAllCheckbox = document.getElementById('selectAllCheckbox');
    const batchPlayBtn = document.getElementById('batchPlayBtn');
    const batchDownloadBtn = document.getElementById('batchDownloadBtn');
    const clearAllDataBtn = document.getElementById('clearAllDataBtn');
    
    const audioPlayer = document.getElementById('audioPlayer');
    const playerCard = document.getElementById('playerCard');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const stopPlayBtn = document.getElementById('stopPlayBtn');
    const seekSlider = document.getElementById('seekSlider');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const durationDisplay = document.getElementById('durationDisplay');
    const playerInfoText = document.getElementById('playerInfoText');

    const thresholdRange = document.getElementById('thresholdRange');
    const thresholdValue = document.getElementById('thresholdValue');
    const meterFill = document.getElementById('meterFill');
    const meterThreshold = document.getElementById('meterThreshold');
    
    const monitorVolumeRange = document.getElementById('monitorVolumeRange');
    const monitorVolumeValue = document.getElementById('monitorVolumeValue');
    const monitorMuteBtn = document.getElementById('monitorMuteBtn');

    let soundThreshold = parseFloat(thresholdRange.value);
    const METER_SCALE_MAX = 0.3; 

    // 設定パネルの表示切替
    toggleSettingsBtn.addEventListener('click', () => {
        const isOpen = settingsCard.classList.toggle('open');
        toggleSettingsBtn.textContent = isOpen ? '⚙️ 設定を隠す' : '⚙️ 設定を表示';
    });

    function updateThresholdIndicator() {
        const meterPercent = (soundThreshold / METER_SCALE_MAX) * 100;
        meterThreshold.style.left = `${Math.min(Math.max(meterPercent, 0), 100)}%`;
    }
    updateThresholdIndicator();

    thresholdRange.addEventListener('input', (e) => {
        soundThreshold = parseFloat(e.target.value);
        thresholdValue.textContent = soundThreshold.toFixed(3);
        updateThresholdIndicator();
    });

    monitorVolumeRange.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        monitorVolumeValue.textContent = `${Math.round(val * 100)}%`;
        if (monitorGainNode && audioContext) {
            monitorGainNode.gain.setValueAtTime(isMonitorMuted ? 0 : val, audioContext.currentTime);
        }
    });

    monitorMuteBtn.addEventListener('click', () => {
        isMonitorMuted = !isMonitorMuted;
        if (monitorGainNode && audioContext) {
            monitorGainNode.gain.setValueAtTime(isMonitorMuted ? 0 : parseFloat(monitorVolumeRange.value), audioContext.currentTime);
        }
        if (isMonitorMuted) {
            monitorMuteBtn.textContent = '切';
            monitorMuteBtn.classList.remove('active');
        } else {
            monitorMuteBtn.textContent = '入';
            monitorMuteBtn.classList.add('active');
        }
    });
    monitorMuteBtn.classList.add('active');

    initBtn.addEventListener('click', async () => {
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
            });
            await updateDeviceLists();
            
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            sampleRate = audioContext.sampleRate;

            sourceNode = audioContext.createMediaStreamSource(mediaStream);
            processorNode = audioContext.createScriptProcessor(2048, 1, 1);
            monitorGainNode = audioContext.createGain();

            const initialVol = isMonitorMuted ? 0 : parseFloat(monitorVolumeRange.value);
            monitorGainNode.gain.setValueAtTime(initialVol, audioContext.currentTime);

            processorNode.onaudioprocess = processAudioData;

            sourceNode.connect(processorNode);
            processorNode.connect(audioContext.destination);

            sourceNode.connect(monitorGainNode);
            monitorGainNode.connect(audioContext.destination);

            await audioContext.suspend();

            if (!recognition) {
                recognition = initSpeechRecognition();
            }

            statusBadge.textContent = '待機';
            initBtn.disabled = true;
            startBtn.disabled = false;
        } catch (err) {
            alert('マイク許可エラー');
        }
    });

    async function updateDeviceLists() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const currentSource = audioSourceSelect.value;
        
        audioSourceSelect.innerHTML = '';
        audioOutputSelect.innerHTML = '<option value="">既定のスピーカー</option>';

        devices.forEach(device => {
            if (device.kind === 'audioinput') {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `入力デバイス ${audioSourceSelect.length + 1}`;
                audioSourceSelect.appendChild(option);
            } else if (device.kind === 'audiooutput') {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `出力デバイス ${audioOutputSelect.length + 1}`;
                audioOutputSelect.appendChild(option);
            }
        });

        if (currentSource) audioSourceSelect.value = currentSource;
    }

    function processAudioData(e) {
        if (!isRunning) return;

        const inputData = e.inputBuffer.getChannelData(0);
        const chunkCopy = new Float32Array(inputData);

        let sum = 0;
        for (let i = 0; i < chunkCopy.length; i++) {
            sum += chunkCopy[i] * chunkCopy[i];
        }
        let rms = Math.sqrt(sum / chunkCopy.length);

        let percent = Math.min((rms / METER_SCALE_MAX) * 100, 100);
        meterFill.style.width = `${percent}%`;

        preBuffer.push(chunkCopy);
        if (preBuffer.length > 45) {
            preBuffer.shift();
        }

        if (rms >= soundThreshold) {
            if (!isRecordingAudio) {
                isRecordingAudio = true;
                activeRecordingChunks = [...preBuffer];
                recordingStartTime = Date.now();
                statusBadge.textContent = '録音';
                statusBadge.className = 'status recording';
            }
            if (silenceTimer) {
                clearTimeout(silenceTimer);
                silenceTimer = null;
            }
        } else {
            if (isRecordingAudio && !silenceTimer) {
                silenceTimer = setTimeout(() => {
                    if (isRecordingAudio) {
                        isRecordingAudio = false;

                        statusBadge.textContent = '待機';
                        statusBadge.className = 'status active';

                        const nowEpoch = Date.now();
                        const durationSec = (nowEpoch - recordingStartTime) / 1000;
                        
                        if (durationSec >= 5.0) {
                            const timeStr = new Date(nowEpoch).toLocaleString();
                            const wavBlob = createWavBlob(activeRecordingChunks, sampleRate);
                            const finalRecordedText = currentTranscriptBuffer + interimTranscriptBuffer;
                            saveLogToStorage(nowEpoch, timeStr, durationSec, finalRecordedText, wavBlob);
                        }

                        currentTranscriptBuffer = "";
                        interimTranscriptBuffer = "";
                        liveTranscription.textContent = '';

                        activeRecordingChunks = [];
                        silenceTimer = null;
                    }
                }, 3000);
            }
        }

        if (isRecordingAudio) {
            activeRecordingChunks.push(chunkCopy);
        }

        const outputData = e.outputBuffer.getChannelData(0);
        for (let i = 0; i < inputData.length; i++) {
            outputData[i] = 0; 
        }
    }

    function createWavBlob(chunks, sampleRate) {
        let totalLength = chunks.reduce((acc, chunk) => acc + chunk.length, 0);
        let buffer = new Float32Array(totalLength);
        let offset = 0;
        for (let chunk of chunks) {
            buffer.set(chunk, offset);
            offset += chunk.length;
        }
        let wavBuffer = interleaveAndEncodeWAV(buffer, sampleRate);
        return new Blob([wavBuffer], { type: 'audio/wav' });
    }

    function interleaveAndEncodeWAV(inputSamples, sampleRate) {
        let buffer = new ArrayBuffer(44 + inputSamples.length * 2);
        let view = new DataView(buffer);

        writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + inputSamples.length * 2, true);
        writeString(view, 8, 'WAVE');
        writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, 'data');
        view.setUint32(40, inputSamples.length * 2, true);

        let index = 44;
        for (let i = 0; i < inputSamples.length; i++, index += 2) {
            let s = Math.max(-1, Math.min(1, inputSamples[i]));
            view.setInt16(index, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        return buffer;
    }

    function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
        }
    }

    function formatDuration(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = (seconds % 60).toFixed(1);
        return `${mins > 0 ? mins + '分 ' : ''}${secs}秒`;
    }

    function formatTimeCode(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function handleAudioPlayStart() {
        previousMonitorState = isMonitorMuted;
        isMonitorMuted = true;
        if (monitorGainNode && audioContext) {
            monitorGainNode.gain.setValueAtTime(0, audioContext.currentTime);
        }
        playPauseBtn.textContent = '一時停止';
    }

    function handleAudioPlayEnd() {
        isMonitorMuted = previousMonitorState;
        if (monitorGainNode && audioContext) {
            monitorGainNode.gain.setValueAtTime(isMonitorMuted ? 0 : parseFloat(monitorVolumeRange.value), audioContext.currentTime);
        }
        playPauseBtn.textContent = '再生';
    }

    audioPlayer.onplay = handleAudioPlayStart;
    audioPlayer.onpause = () => {
        playPauseBtn.textContent = '再生';
        handleAudioPlayEnd();
    };
    audioPlayer.onended = () => {
        playPauseBtn.textContent = '再生';
        audioPlayer.currentTime = 0;
        handleAudioPlayEnd();
        
        if (window.playlistQueue && window.playlistQueue.length > 0) {
            const nextItem = window.playlistQueue.shift();
            loadAndPlayAudio(nextItem.url, nextItem.title, 0);
        }
    };

    audioPlayer.ontimeupdate = () => {
        if (!isNaN(audioPlayer.duration)) {
            currentTimeDisplay.textContent = formatTimeCode(audioPlayer.currentTime);
            seekSlider.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        }
    };

    audioPlayer.onloadedmetadata = () => {
        durationDisplay.textContent = formatTimeCode(audioPlayer.duration);
    };

    seekSlider.addEventListener('input', () => {
        if (!isNaN(audioPlayer.duration)) {
            audioPlayer.currentTime = (seekSlider.value / 100) * audioPlayer.duration;
        }
    });

    playPauseBtn.onclick = () => {
        if (audioPlayer.paused) audioPlayer.play().catch(e => {});
        else audioPlayer.pause();
    };

    stopPlayBtn.onclick = () => {
        window.playlistQueue = [];
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        handleAudioPlayEnd();
        playerCard.style.display = 'none';
    };

    async function loadAndPlayAudio(audioUrl, titleText, startSec = 0) {
        playerCard.style.display = 'flex';
        playerInfoText.textContent = `再生: ${titleText}`;
        if (audioPlayer.src !== audioUrl) {
            audioPlayer.src = audioUrl;
            audioPlayer.load();
            const selectedOutput = audioOutputSelect.value;
            if (selectedOutput && typeof audioPlayer.setSinkId === 'function') {
                try { await audioPlayer.setSinkId(selectedOutput); } catch (e) {}
            }
        }
        audioPlayer.currentTime = Math.max(0, startSec);
        audioPlayer.play().catch(e => alert('再生エラー'));
    }

    const STORAGE_KEY = 'wireless_log_database_v6';

    function loadLogsFromStorage() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            const now = Date.now();
            const THREE_DAYS_MS = 3 * 24 * 60 * 60 * 1000;

            const validItems = parsed.filter(item => (now - item.timestampEpoch) <= THREE_DAYS_MS);
            
            return validItems.map(item => {
                const blob = base64ToBlob(item.audioBase64, 'audio/wav');
                const audioUrl = URL.createObjectURL(blob);
                return {
                    ...item,
                    audioBlob: blob,
                    audioUrl: audioUrl
                };
            });
        } catch (e) {
            console.error('ストレージ読み込みエラー', e);
            return [];
        }
    }

    function saveLogsToStorage() {
        try {
            const minimalItems = logDatabase.map(item => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        resolve({
                            timestampEpoch: item.timestampEpoch,
                            timestampStr: item.timestampStr,
                            durationSec: item.durationSec,
                            text: item.text,
                            audioBase64: reader.result
                        });
                    };
                    reader.readAsDataURL(item.audioBlob);
                });
            });

            Promise.all(minimalItems).then(results => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(results));
            });
        } catch (e) {
            console.error('ストレージ保存エラー', e);
        }
    }

    function base64ToBlob(base64, mime) {
        const parts = base64.split(',');
        const byteString = atob(parts[1]);
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
        }
        return new Blob([ab], { type: mime });
    }

    function cleanOldLogs() {
        const now = Date.now();
        const THREE_DAYS_MS = 3 * 24 * 60 * 60 * 1000;
        
        let changed = false;
        logDatabase = logDatabase.filter(item => {
            const isAlive = (now - item.timestampEpoch) <= THREE_DAYS_MS;
            if (!isAlive) {
                changed = true;
                if (item.audioUrl) URL.revokeObjectURL(item.audioUrl);
            }
            return isAlive;
        });

        if (changed) {
            saveLogsToStorage();
        }
        renderLogTable();
    }

    clearAllDataBtn.addEventListener('click', () => {
        if (confirm('保存されているすべてのログと音声データを削除しますか？')) {
            logDatabase.forEach(item => {
                if (item.audioUrl) URL.revokeObjectURL(item.audioUrl);
            });
            logDatabase = [];
            localStorage.removeItem(STORAGE_KEY);
            renderLogTable();
            alert('すべてのデータを削除しました。');
        }
    });

    function updateBatchButtonStates() {
        const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
        const hasChecked = checkedBoxes.length > 0;
        batchPlayBtn.disabled = !hasChecked;
        batchDownloadBtn.disabled = !hasChecked;
    }

    selectAllCheckbox.addEventListener('change', (e) => {
        const checkboxes = document.querySelectorAll('.row-checkbox');
        checkboxes.forEach(cb => cb.checked = e.target.checked);
        updateBatchButtonStates();
    });

    function sortLogData(column) {
        if (currentSortColumn === column) {
            currentSortAscending = !currentSortAscending;
        } else {
            currentSortColumn = column;
            currentSortAscending = true;
        }

        logDatabase.sort((a, b) => {
            let valA, valB;
            if (column === 'time') {
                valA = a.timestampEpoch;
                valB = b.timestampEpoch;
            } else if (column === 'duration') {
                valA = a.durationSec;
                valB = b.durationSec;
            } else if (column === 'text') {
                valA = (a.text || '').toLowerCase();
                valB = (b.text || '').toLowerCase();
            }

            if (valA < valB) return currentSortAscending ? -1 : 1;
            if (valA > valB) return currentSortAscending ? 1 : -1;
            return 0;
        });

        renderLogTable();
        updateSortIcons();
    }

    function updateSortIcons() {
        document.querySelectorAll('th[data-sort]').forEach(th => {
            const icon = th.querySelector('.sort-icon');
            const col = th.dataset.sort;
            if (col === currentSortColumn) {
                icon.textContent = currentSortAscending ? ' ▲' : ' ▼';
            } else {
                icon.textContent = ' ↕';
            }
        });
    }

    document.querySelectorAll('th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
            sortLogData(th.dataset.sort);
        });
    });

    function renderLogTable() {
        logTableBody.innerHTML = '';
        if (logDatabase.length === 0) {
            logTableBody.appendChild(emptyRow);
            selectAllCheckbox.checked = false;
            updateBatchButtonStates();
            return;
        }

        logDatabase.forEach((logItem, index) => {
            const tr = document.createElement('tr');
            
            const tdSelect = document.createElement('td');
            tdSelect.className = 'col-select';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'row-checkbox';
            checkbox.dataset.index = index;
            checkbox.onchange = () => {
                updateBatchButtonStates();
                const all = document.querySelectorAll('.row-checkbox');
                const checkedAll = document.querySelectorAll('.row-checkbox:checked');
                selectAllCheckbox.checked = all.length === checkedAll.length;
            };
            tdSelect.appendChild(checkbox);
            tr.appendChild(tdSelect);

            const tdTime = document.createElement('td');
            tdTime.className = 'col-time';
            tdTime.textContent = logItem.timestampStr;
            tr.appendChild(tdTime);

            const tdDuration = document.createElement('td');
            tdDuration.className = 'col-duration';
            tdDuration.textContent = formatDuration(logItem.durationSec);
            tr.appendChild(tdDuration);

            const tdText = document.createElement('td');
            tdText.className = 'col-text';
            
            if (logItem.text && logItem.text.trim() !== '') {
                const words = logItem.text.split('');
                words.forEach((char, charIdx) => {
                    const span = document.createElement('span');
                    span.textContent = char;
                    span.className = 'clickable-text';
                    span.title = 'クリック再生';
                    span.onclick = () => {
                        const ratio = charIdx / words.length;
                        let targetSec = (ratio * logItem.durationSec * 0.9) - 1.5;
                        if (targetSec < 0) targetSec = 0;
                        
                        window.playlistQueue = [];
                        loadAndPlayAudio(logItem.audioUrl, `${logItem.timestampStr} (${formatDuration(logItem.durationSec)})`, targetSec);
                    };
                    tdText.appendChild(span);
                });
            } else {
                tdText.textContent = '（テキストなし）';
            }
            tr.appendChild(tdText);

            const tdAction = document.createElement('td');
            tdAction.className = 'col-action';

            const actionDiv = document.createElement('div');
            actionDiv.className = 'action-btns';

            const lineBtn = document.createElement('button');
            lineBtn.className = 'btn-sm btn-line';
            lineBtn.textContent = '共有';
            lineBtn.onclick = async () => {
                const shareText = `【無線受信ログ】\n検知日時: ${logItem.timestampStr}\n録音時間: ${formatDuration(logItem.durationSec)}\n内容: ${logItem.text || '（音声のみ）'}`;
                const audioFile = new File([logItem.audioBlob], `wireless_${logItem.timestampEpoch}.wav`, { type: 'audio/wav' });

                if (navigator.canShare && navigator.canShare({ files: [audioFile] })) {
                    try {
                        await navigator.share({
                            title: '無線受信ログ',
                            text: shareText,
                            files: [audioFile]
                        });
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            alert('共有エラー');
                        }
                    }
                } else if (navigator.share) {
                    try {
                        await navigator.share({
                            title: '無線受信ログ',
                            text: shareText
                        });
                    } catch (err) {}
                } else {
                    const lineUrl = `https://social-plugins.line.me/lineit/share?text=${encodeURIComponent(shareText)}`;
                    window.open(lineUrl, '_blank');
                }
            };
            actionDiv.appendChild(lineBtn);

            const playBtn = document.createElement('button');
            playBtn.className = 'btn-sm secondary';
            playBtn.textContent = '再生';
            playBtn.onclick = () => {
                window.playlistQueue = [];
                loadAndPlayAudio(logItem.audioUrl, `${logItem.timestampStr} (${formatDuration(logItem.durationSec)})`, 0);
            };
            actionDiv.appendChild(playBtn);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-sm btn-danger';
            deleteBtn.textContent = '削除';
            deleteBtn.onclick = () => {
                URL.revokeObjectURL(logItem.audioUrl);
                const realIndex = logDatabase.indexOf(logItem);
                if (realIndex > -1) {
                    logDatabase.splice(realIndex, 1);
                }
                saveLogsToStorage();
                renderLogTable();
            };
            actionDiv.appendChild(deleteBtn);

            tdAction.appendChild(actionDiv);
            tr.appendChild(tdAction);

            logTableBody.appendChild(tr);
        });
        updateBatchButtonStates();
    }

    batchPlayBtn.onclick = () => {
        const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
        if (checkedBoxes.length === 0) return;

        let selectedItems = Array.from(checkedBoxes).map(cb => logDatabase[parseInt(cb.dataset.index)]);
        selectedItems.sort((a, b) => a.timestampEpoch - b.timestampEpoch);

        const queue = selectedItems.map(item => ({
            url: item.audioUrl,
            title: `${item.timestampStr} (${formatDuration(item.durationSec)})`
        }));

        if (queue.length > 0) {
            const first = queue.shift();
            window.playlistQueue = queue;
            loadAndPlayAudio(first.url, first.title, 0);
        }
    };

    batchDownloadBtn.onclick = async () => {
        const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
        if (checkedBoxes.length === 0) return;

        batchDownloadBtn.disabled = true;
        batchDownloadBtn.textContent = '作成中...';

        try {
            let selectedItems = Array.from(checkedBoxes).map(cb => logDatabase[parseInt(cb.dataset.index)]);
            selectedItems.sort((a, b) => a.timestampEpoch - b.timestampEpoch);

            const zip = new JSZip();
            const safeZipTime = new Date().toISOString().replace(/[-:T]/g, '_').slice(0, 15);

            selectedItems.forEach((item, idx) => {
                const dateObj = new Date(item.timestampEpoch);
                const fileNameTime = dateObj.getFullYear() + '-' +
                    String(dateObj.getMonth() + 1).padStart(2, '0') + '-' +
                    String(dateObj.getDate()).padStart(2, '0') + '_' +
                    String(dateObj.getHours()).padStart(2, '0') + '-' +
                    String(dateObj.getMinutes()).padStart(2, '0') + '-' +
                    String(dateObj.getSeconds()).padStart(2, '0');

                zip.file(`${fileNameTime}.wav`, item.audioBlob);
                const textContent = item.text || '（テキストなし）';
                zip.file(`${fileNameTime}.txt`, textContent);
            });

            const content = await zip.generateAsync({ type: "blob" });
            const downloadUrl = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `wireless_logs_${safeZipTime}.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);

        } catch (err) {
            alert('ダウンロードエラー');
        } finally {
            batchDownloadBtn.disabled = false;
            batchDownloadBtn.textContent = 'ZIPダウンロード';
        }
    };

    function saveLogToStorage(timestampEpoch, timestampStr, durationSec, text, audioBlob) {
        const audioUrl = URL.createObjectURL(audioBlob);
        logDatabase.unshift({
            timestampEpoch,
            timestampStr,
            durationSec,
            text,
            audioBlob,
            audioUrl
        });
        cleanOldLogs();
        saveLogsToStorage();
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return null;

        const rec = new SpeechRecognition();
        rec.lang = 'ja-JP';
        rec.continuous = true;
        rec.interimResults = true;

        rec.onresult = (event) => {
            let interim = '';
            let final = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    final += event.results[i][0].transcript;
                } else {
                    interim += event.results[i][0].transcript;
                }
            }

            if (final.trim() !== '') {
                currentTranscriptBuffer += final;
            }
            interimTranscriptBuffer = interim;
            
            const displayFullText = currentTranscriptBuffer + interimTranscriptBuffer;
            if (displayFullText.trim() !== '') {
                liveTranscription.textContent = displayFullText;
            }
        };

        rec.onend = () => {
            if (isRunning) {
                setTimeout(() => {
                    if (isRunning) {
                        try { rec.start(); } catch (e) {}
                    }
                }, 500);
            }
        };
        return rec;
    }

    startBtn.addEventListener('click', async () => {
        try {
            if (!audioContext) {
                alert("マイク接続許可を押してください。");
                return;
            }
            
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }

            isRunning = true;
            if (recognition) {
                try { recognition.start(); } catch (e) {}
            }

            statusBadge.textContent = '待機';
            statusBadge.classList.add('active');
            startBtn.disabled = true;
            stopBtn.disabled = false;

        } catch (err) {
            alert('開始エラー');
        }
    });

    stopBtn.addEventListener('click', async () => {
        isRunning = false;
        if (silenceTimer) {
            clearTimeout(silenceTimer);
            silenceTimer = null;
        }

        if (isRecordingAudio) {
            isRecordingAudio = false;
            if (activeRecordingChunks.length > 0) {
                const nowEpoch = Date.now();
                const durationSec = (nowEpoch - recordingStartTime) / 1000;
                
                if (durationSec >= 5.0) {
                    const timeStr = new Date(nowEpoch).toLocaleString();
                    const wavBlob = createWavBlob(activeRecordingChunks, sampleRate);
                    const finalRecordedText = currentTranscriptBuffer + interimTranscriptBuffer;
                    saveLogToStorage(nowEpoch, timeStr, durationSec, finalRecordedText, wavBlob);
                }
            }
        }

        if (recognition) {
            try { recognition.stop(); } catch(e) {}
        }
        
        if (audioContext && audioContext.state === 'running') {
            await audioContext.suspend();
        }

        statusBadge.textContent = '待機';
        statusBadge.className = 'status';
        startBtn.disabled = false;
        stopBtn.disabled = true;
        liveTranscription.textContent = '';
        meterFill.style.width = '0%';
    });

    // 起動時に保存されたログを読み込んでテーブルに反映
    logDatabase = loadLogsFromStorage();
    cleanOldLogs();
</script>

</body>
